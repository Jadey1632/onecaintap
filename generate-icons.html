<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<p>Right-click each canvas and "Save image as" icon-192.png / icon-512.png into assets/icons/</p>

<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>

<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  // Background
  ctx.fillStyle = '#11139C';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.2);
  ctx.fill();
  // Circle
  ctx.strokeStyle = '#F0DA42';
  ctx.lineWidth = s * 0.04;
  ctx.beginPath();
  ctx.arc(s/2, s*0.42, s*0.28, 0, Math.PI*2);
  ctx.stroke();
  // ONE text
  ctx.fillStyle = '#FFFFFF';
  ctx.font = `bold ${s*0.1}px Georgia`;
  ctx.textAlign = 'center';
  ctx.fillText('ONE', s/2, s*0.33);
  // CAIN text
  ctx.fillStyle = '#F0DA42';
  ctx.font = `bold ${s*0.18}px Georgia`;
  ctx.fillText('CAIN', s/2, s*0.5);
  // TA text
  ctx.fillText('TA', s/2, s*0.66);
  // Bottom label
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = `${s*0.065}px Georgia`;
  ctx.fillText('CAINTA', s/2, s*0.88);
}
drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));
</script>
</body>
</html>
